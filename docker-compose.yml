version: '3.8'

services:
  xyaoled-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xyaoled-daemon
    restart: unless-stopped
    ports:
      - "11001:11001"
    environment:
      - HTTP_PORT=11001
      - HTTP_HOST=0.0.0.0
      - LED_PANEL_MAC=${LED_PANEL_MAC:-AA:BB:CC:DD:EE:FF}
      - LED_DISPLAY_WIDTH=${LED_DISPLAY_WIDTH:-96}
      - LED_DISPLAY_HEIGHT=${LED_DISPLAY_HEIGHT:-16}
      - DEBUG_BLE=${DEBUG_BLE:-false}
      - STREAM_FPS=${STREAM_FPS:-4}
      - STREAM_RESUME_DELAY=${STREAM_RESUME_DELAY:-1.5}
      - UPSIDE_DOWN=${UPSIDE_DOWN:-false}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    # Required for Bluetooth access
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /sys/class/bluetooth:/sys/class/bluetooth:ro
      - /sys/bus/usb:/sys/bus/usb:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    security_opt:
      - apparmor:unconfined
